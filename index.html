<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <iframe id="signage-frame" src="" allow="autoplay" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>

  <script>
    // URL tillämpad med &rm=minimal för ren kioskvisning
    const SLIDES_FORMIDDAG = "https://docs.google.com/presentation/d/e/2PACX-1vQ1Q4whKhiEfYJwu4PBMmiBPnS91khxwsGRLvEAJyWGzfob8iWmBRHf6eV4w2YlUCVIEv6fHHDEtG5B/pub?start=true&loop=true&delayms=5000&rm=minimal";
    const SLIDES_EFTERMIDDAG = "https://docs.google.com/presentation/d/e/2PACX-1vQ1Q4whKhiEfYJwu4PBMmiBPnS91khxwsGRLvEAJyWGzfob8iWmBRHf6eV4w2YlUCVIEv6fHHDEtG5B/pub?start=true&loop=true&delayms=5000&rm=minimal";

    let currentURL = "";

    function updateSchedule() {
      const now = new Date();
      const hours = now.getHours();
      
      // Tidsbaserad schemaläggning: Förmiddag (07:00–11:59), Eftermiddag/Kväll (12:00–06:59)
      let targetURL = (hours >= 7 && hours < 12) ? SLIDES_FORMIDDAG : SLIDES_EFTERMIDDAG;

      if (targetURL !== currentURL) {
        currentURL = targetURL;
        document.getElementById("signage-frame").src = currentURL;
      }
    }

    function refreshIframe() {
      const frame = document.getElementById("signage-frame");
      if (frame && currentURL) {
        const separator = currentURL.includes('?') ? '&' : '?';
        frame.src = currentURL + separator + 'refresh=' + new Date().getTime();
      }
    }

    updateSchedule();
    setInterval(updateSchedule, 60000);  // Kontrollera schemaskifte varje minut
    setInterval(refreshIframe, 300000);   // Mjuk bakgrundsuppdatering av cachen var 5:e minut
  </script>
</body>
</html>
